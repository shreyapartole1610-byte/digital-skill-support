<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - Digital Skill Support</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #222;
}

header {
    background: #12395d;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 8px 0 0;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 15px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}

.card h2 {
    margin: 10px 0;
    color: #12395d;
    font-size: 35px;
}

.card p {
    margin: 0;
    font-size: 16px;
}

.section {
    background: white;
    padding: 20px;
    margin-bottom: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}

.section h2 {
    color: #12395d;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #12395d;
    color: white;
}

button {
    background: #1769aa;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
}

#message {
    text-align: center;
    margin: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>🔐 Admin Dashboard</h1>
    <p>Digital Skill Support for Local Government Office</p>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <div>💬</div>
            <h2 id="feedbackCount">0</h2>
            <p>Total Feedback</p>
        </div>

        <div class="card">
            <div>📊</div>
            <h2 id="responseCount">0</h2>
            <p>Database Responses</p>
        </div>

    </div>

    <div class="section">

        <h2>💬 Feedback Details</h2>

        <button onclick="loadFeedback()">
            🔄 Refresh Feedback
        </button>

        <div id="message"></div>

        <div style="overflow-x:auto; margin-top:20px;">

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Area</th>
                        <th>Feedback</th>
                    </tr>
                </thead>

                <tbody id="feedbackTable">
                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
"https://lmojlnoiqqagifxoshgn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yldulfbRu9jgYHVhcUOe7A_PvmEs-v1"


async function loadFeedback() {

    const message =
        document.getElementById("message");

    const table =
        document.getElementById("feedbackTable");

    message.innerText = "Loading...";

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/feedback?select=name,email,area,feedback",
            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                    "Bearer " + SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);
        }

        const data =
            await response.json();

        table.innerHTML = "";

        data.forEach(function(row) {

            const tr =
                document.createElement("tr");

            tr.innerHTML = `
                <td>${row.name || ""}</td>
                <td>${row.email || ""}</td>
                <td>${row.area || "General"}</td>
                <td>${row.feedback || ""}</td>
            `;

            table.appendChild(tr);

        });

        document.getElementById(
            "feedbackCount"
        ).innerText = data.length;

        document.getElementById(
            "responseCount"
        ).innerText = data.length;

        message.innerText =
            "Feedback loaded successfully!";

    } catch(error) {

        console.error(error);

        message.innerText =
            "Unable to load feedback.";

    }

}

loadFeedback();

</script>

</body>
</html>
