<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - Digital Skill Support</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #222;
}

header {
    background: #12395d;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 8px 0 0;
}

.login-box {
    max-width: 400px;
    margin: 50px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}

.login-box h2 {
    text-align: center;
    color: #12395d;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    background: #1769aa;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

.login-box button {
    width: 100%;
    margin-top: 10px;
}

#loginMessage {
    text-align: center;
    margin-top: 15px;
    color: red;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 15px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}

.card h2 {
    margin: 10px 0;
    color: #12395d;
    font-size: 35px;
}

.section {
    background: white;
    padding: 20px;
    margin-bottom: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}

.section h2 {
    color: #12395d;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #12395d;
    color: white;
}

#message {
    text-align: center;
    margin: 15px;
    font-weight: bold;
}

.logout {
    float: right;
    background: #d9534f;
}

.clear {
    clear: both;
}
</style>
</head>

<body>

<header>
    <button class="logout" id="logoutBtn" style="display:none;">
        Logout
    </button>

    <h1>🔐 Admin Dashboard</h1>
    <p>Digital Skill Support for Local Government Office</p>

    <div class="clear"></div>
</header>


<!-- LOGIN -->
<div id="loginSection" class="login-box">

    <h2>🔐 Admin Login</h2>

    <input
        type="email"
        id="loginEmail"
        placeholder="Enter admin email"
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="Enter password"
    >

    <button onclick="adminLogin()">
        Login
    </button>

    <div id="loginMessage"></div>

</div>


<!-- DASHBOARD -->
<div id="dashboardSection" class="container" style="display:none;">

    <div class="cards">

        <div class="card">
            <div>💬</div>

            <h2 id="feedbackCount">0</h2>

            <p>Total Feedback</p>
        </div>


        <div class="card">
            <div>📊</div>

            <h2 id="responseCount">0</h2>

            <p>Database Responses</p>
        </div>

    </div>


    <div class="section">

        <h2>💬 Feedback Details</h2>

        <button onclick="loadFeedback()">
            🔄 Refresh Feedback
        </button>

        <div id="message"></div>

        <div style="overflow-x:auto; margin-top:20px;">

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Area</th>
                        <th>Feedback</th>
                    </tr>

                </thead>

                <tbody id="feedbackTable"></tbody>

            </table>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lmojlnoiqqagifxoshgn.supabase.co";


const SUPABASE_KEY =
"sb_publishable_yldulfbRu9jgYHVhcUOe7A_PvmEs-v1"


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ADMIN LOGIN
async function adminLogin() {

    const email =
        document.getElementById("loginEmail").value;

    const password =
        document.getElementById("loginPassword").value;

    const loginMessage =
        document.getElementById("loginMessage");

    if (!email || !password) {

        loginMessage.innerText =
            "Please enter email and password.";

        return;
    }

    loginMessage.innerText = "Logging in...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        loginMessage.innerText =
            "Login failed: " + error.message;

        return;
    }

    loginMessage.innerText = "";

    document.getElementById("loginSection").style.display =
        "none";

    document.getElementById("dashboardSection").style.display =
        "block";

    document.getElementById("logoutBtn").style.display =
        "block";

    loadFeedback();
}


// LOAD FEEDBACK
async function loadFeedback() {

    const message =
        document.getElementById("message");

    const table =
        document.getElementById("feedbackTable");

    message.innerText = "Loading...";

    const { data, error } =
        await supabaseClient
        .from("Feedback")
        .select("name,email,area,feedback");

    if (error) {

        console.error(error);

        message.innerText =
            "Unable to load feedback.";

        return;
    }

    table.innerHTML = "";

    data.forEach(function(row) {

        const tr =
            document.createElement("tr");

        tr.innerHTML = `
            <td>${row.name || ""}</td>
            <td>${row.email || ""}</td>
            <td>${row.area || "General"}</td>
            <td>${row.feedback || ""}</td>
        `;

        table.appendChild(tr);

    });


    document.getElementById(
        "feedbackCount"
    ).innerText = data.length;


    document.getElementById(
        "responseCount"
    ).innerText = data.length;


    message.innerText =
        "Feedback loaded successfully!";
}


// LOGOUT
document.getElementById("logoutBtn")
.addEventListener("click", async function() {

    await supabaseClient.auth.signOut();

    document.getElementById("dashboardSection")
        .style.display = "none";

    document.getElementById("loginSection")
        .style.display = "block";

    document.getElementById("logoutBtn")
        .style.display = "none";

});


</script>

</body>
</html>
